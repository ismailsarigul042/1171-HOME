<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>1171 HOME | Giriş</title>
<style>
:root{--gold:#d8b66a;--gold2:#f0d99b;--line:#2b2e36;--muted:#a4a6ad}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% -20%,#34302a 0,#141519 42%,#0c0d10 78%);color:#f3f1eb;font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}.login{width:min(420px,100%);background:linear-gradient(145deg,#1c1d21,#101115);border:1px solid #51452d;border-radius:22px;padding:34px;box-shadow:0 24px 80px #0009;text-align:center}.logo{width:76px;height:76px;border:1px solid var(--gold);border-radius:20px;margin:0 auto 18px;display:grid;place-items:center;color:var(--gold2);font-size:27px;font-weight:900;letter-spacing:-2px}.eyebrow{font-size:11px;letter-spacing:4px;color:var(--gold);font-weight:700}h1{font-size:29px;letter-spacing:5px;margin:6px 0 0}p{color:var(--muted);font-size:13px;margin:8px 0 24px}.field{width:100%;background:#0b0c0f;border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:white;outline:none}.field:focus{border-color:var(--gold)}button{background:linear-gradient(135deg,#f0d99b,#b88d3e);color:#17130b;border:0;border-radius:10px;padding:12px 18px;font-weight:800;width:100%;margin-top:12px;cursor:pointer}.hint{font-size:11px;color:#777;margin-top:18px}#error{color:#e28b8b;font-size:12px;margin-top:10px;min-height:18px}
</style></head><body><main class="login"><div class="logo">1171</div><div class="eyebrow">PRIVATE ACCESS</div><h1>1171 HOME</h1><p>COMMAND CENTER · STRATEGY & MANAGEMENT</p><form id="form"><input class="field" id="password" type="password" placeholder="Erişim parolası" autocomplete="current-password" required autofocus><button type="submit">SİSTEME GİRİŞ YAP&nbsp; →</button></form><div id="error"></div><div class="hint">1171 COMMAND CENTER</div></main>
<script>const form=document.getElementById('form'),pass=document.getElementById('password'),error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='Kontrol ediliyor…';try{const r=await fetch('/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass.value})});if(r.ok){location.replace('/')}else{error.textContent='Parola hatalı. Tekrar deneyin.';pass.select()}}catch(_){error.textContent='Bağlantı kurulamadı. Tekrar deneyin.'}});</script></body></html>

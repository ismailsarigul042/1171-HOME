<script>
const form=document.getElementById('form');
const pass=document.getElementById('password');
const error=document.getElementById('error');

form.addEventListener('submit',async e=>{
  e.preventDefault();
  error.textContent='Kontrol ediliyor…';

  try{
    const r=await fetch('/auth',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pass.value})
    });

    if(r.ok){
      document.body.innerHTML=`
        <main class="ottoman">
          <div class="ornament">✦　✧　✦</div>
          <h1>OTTOMAN</h1>
          <div class="line"></div>
          <p>1171 · COMMAND CENTER</p>
          <div class="dots"><i></i><i></i><i></i></div>
        </main>`;

      const style=document.createElement('style');
      style.textContent=`
        body{margin:0;min-height:100vh;display:grid;place-items:center;
        background:radial-gradient(ellipse at center,#292216,#11100d 45%,#050505);
        color:#e4c783;font-family:Georgia,serif;overflow:hidden}
        .ottoman{text-align:center;animation:appear 1s ease}
        h1{font-size:clamp(48px,11vw,104px);letter-spacing:.16em;
        text-shadow:0 0 24px #cda65e55}
        .ornament{letter-spacing:14px;color:#b58b48;font-size:22px}
        .line{width:280px;max-width:70vw;height:1px;margin:25px auto;
        background:linear-gradient(90deg,transparent,#cda65e,transparent)}
        p{font:11px Arial;letter-spacing:.38em;color:#b8a47e}
        .dots{display:flex;justify-content:center;gap:8px;margin-top:30px}
        .dots i{width:5px;height:5px;border-radius:50%;background:#c7a15b;
        animation:pulse 1s infinite}
        .dots i:nth-child(2){animation-delay:.2s}
        .dots i:nth-child(3){animation-delay:.4s}
        @keyframes pulse{50%{opacity:.2;transform:scale(.7)}}
        @keyframes appear{from{opacity:0;transform:translateY(12px)}
        to{opacity:1;transform:translateY(0)}}
      `;
      document.head.appendChild(style);
      setTimeout(()=>location.replace('/'),2400);

    }else{
      error.textContent='Parola hatalı. Tekrar deneyin.';
      pass.select();
    }
  }catch(_){
    error.textContent='Bağlantı kurulamadı. Tekrar deneyin.';
  }
});
</script>
